<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strike-Web</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three.module.js",
      "three/addons/": "/vendor/addons/"
    }
  }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="fps">-- FPS</div>
    <div id="map">Desert 2</div>

    <div id="crosshair">
      <span class="c top"></span>
      <span class="c bottom"></span>
      <span class="c left"></span>
      <span class="c right"></span>
    </div>
    <div id="hitmarker">✕</div>

    <div id="weapon">
      <div id="weapon-name">Glock-18</div>
      <div id="weapon-ammo">20 / 60</div>
    </div>
    <div id="reload-hint">ПЕРЕЗАРЯДКА…</div>

    <div id="vitals">
      <div class="bar-wrap hp">
        <span class="bar-label">HP</span>
        <div class="bar"><div class="bar-fill" id="hp-fill"></div></div>
        <span class="bar-num" id="hp-num">100</span>
      </div>
      <div class="bar-wrap st">
        <span class="bar-label">СТАМ</span>
        <div class="bar"><div class="bar-fill" id="stamina-fill"></div></div>
        <span class="bar-num" id="stamina-num">100</span>
      </div>
    </div>

    <div id="hint">WASD — бег · Space — прыжок · ЛКМ — огонь · ПКМ — прицел · R — перезарядка · 1-4 — оружие · M — настройки</div>
  </div>

  <div id="damage-flash"></div>

  <div id="death-overlay" class="hidden">
    <h1>ТЫ УМЕР</h1>
    <p>Возрождение через <span id="death-timer">3</span>…</p>
  </div>

  <button id="btn-settings" title="Настройки (M)">⚙</button>

  <div id="settings-panel" class="hidden">
    <h2>Настройки</h2>

    <div class="setting-row">
      <span class="label">Качество графики</span>
      <div class="btn-group">
        <button data-level="low">Низкое</button>
        <button data-level="medium">Среднее</button>
        <button data-level="ultra">Ультра</button>
      </div>
    </div>

    <div class="setting-row">
      <span class="label">Карта</span>
      <div class="btn-group">
        <button data-map="desert2">Desert 2</button>
        <button data-map="wasteland">Пустошь</button>
      </div>
    </div>

    <label class="check"><input type="checkbox" id="opt-fps" /> Показывать FPS</label>
    <label class="check"><input type="checkbox" id="opt-shadows" /> Тени</label>

    <p id="settings-note" class="note"></p>
    <button id="btn-close-settings" class="primary">Продолжить</button>
  </div>

  <div id="overlay">
    <div class="overlay-box">
      <h1 id="overlay-title">STRIKE-WEB</h1>
      <p id="overlay-hint">Кликни, чтобы играть</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
